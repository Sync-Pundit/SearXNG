# --- searx.syncpundit.io ---------------------------------------------------
# Adds over the old bare proxy_pass:
#   1. Proxy headers (were missing entirely). Without them SearXNG cannot see
#      the real client. It logs "X-Forwarded-For nor X-Real-IP header is set!"
#      and botdetection cannot work.
#   2. The JSON gate defined by the maps at the top of this file.
server {
    server_name searx.syncpundit.io;

    # Inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # searx/flaskfix.py reads X-Forwarded-Host when building absolute URLs.
    # settings.yml `base_url` already pins this, but sending the header keeps
    # things correct even if base_url is ever cleared.
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    location / {
        if ($th_block_json) { return 403; }
        proxy_pass http://127.0.0.1:8080;
    }

    # /search is gated harder than the rest of the site.
    location = /search {
        if ($th_block_json) { return 403; }

        # nginx cannot inspect a POST body, so `format=json` submitted as form
        # data would slip past the $arg_format gate. prod/settings.yml sets
        # `method: "GET"` precisely so nothing legitimate POSTs here and this
        # rule can close that hole. (Scoped to /search because the preferences form
        # is a genuine POST and must keep working.)
        if ($request_method = POST) { return 405; }

        proxy_pass http://127.0.0.1:8080;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/searx.syncpundit.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/searx.syncpundit.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

