# ===========================================================================
# /etc/nginx/sites-enabled/default - PixelForge, all vhosts in one file
# ===========================================================================
# Complete replacement for the live file. Only the searx.syncpundit.io parts
# differ from what was already deployed; every other vhost is unchanged.
#
# ONE THING TO DO BEFORE RELOADING: uncomment the token line in the
# `$th_authed` map below and paste your token. Everything else is ready.
#
#   openssl rand -hex 32
#   sudo nginx -t && sudo systemctl reload nginx
#
# The token stays in this deployed file only. It is not in Git. Never paste it back
# into the repo copy.
# ===========================================================================


# ---------------------------------------------------------------------------
# searx.syncpundit.io - JSON API gate
# ---------------------------------------------------------------------------
# prod/settings.yml enables `formats: [html, json]`, which turns
# /search?format=json into a usable search API on a public host, including
# queries that spend the Brave (and later Serper) quota. This restricts JSON
# to the harness while leaving the HTML UI public.
#
# A "Bearer <64 hex chars>" key is 71 bytes and overflows nginx's default
# 64-byte map hash bucket:
#   [emerg] could not build map_hash, you should increase map_hash_bucket_size: 64
map_hash_bucket_size 128;

# NOTE: nginx does NOT error on duplicate map definitions for the same
# variable. The last one silently wins. Keep exactly one $th_authed map.
map $http_authorization $th_authed {
    default 0;

    # Edit the line below before deployment.
    # Uncomment and replace with `openssl rand -hex 32` output.
    # Left commented on purpose: shipped as-is this authenticates nobody, so
    # JSON is closed rather than open. A live placeholder token in a tracked
    # file is a real credential the moment it deploys. That happened once.
    #
    # "Bearer PASTE_YOUR_TOKEN_HERE"  1;
    #
    # Nothing else in this map needs changing.
}

map $arg_format $th_wants_json {
    default 0;
    json    1;
}

# 1 only when JSON is requested WITHOUT a valid harness token.
map "$th_wants_json:$th_authed" $th_block_json {
    default 0;
    "1:0"   1;
}


server {
  server_name blog.pixelforge.app;
  client_max_body_size 20m;

  location / {
    proxy_pass http://127.0.0.1:1337;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}


