# SyncPundit SearXNG — production compose.
#
# Runs OUR OWN image built from this fork, not docker.io/searxng/searxng.
# This is mandatory, not a preference: the `!env` YAML tag used by
# prod/settings.yml is implemented in searx/settings_loader.py, which only
# exists in this fork. An upstream prebuilt image would fail to parse the
# settings file ("could not determine a constructor for the tag '!env'").
#
# Build the image first (see prod/README.md):
#   GITHUB_REPOSITORY_OWNER=syncpundit ./manage container.build docker

name: searxng

services:
  core:
    container_name: searxng-core
    image: localhost/syncpundit/searxng:latest
    restart: always

    # SECURITY: bind to loopback only. Docker publishes ports by punching
    # straight through the host firewall, so "8080:8080" would expose the
    # container on the box's public IP and let anyone bypass nginx entirely —
    # including the JSON API gate. nginx is the only intended way in.
    ports:
      - "127.0.0.1:8080:8080"

    # SEARXNG_SECRET, BRAVE_API_KEY — consumed by the `!env` tags in
    # settings.yml. Never committed (prod/.env is gitignored).
    env_file: ./.env

    environment:
      # settings.yml is bind-mounted read-only; skip the entrypoint's
      # chown -R of the config dir so it doesn't warn on every start.
      FORCE_OWNERSHIP: "false"

    volumes:
      # Single source of truth: the same file used for local dev via
      # SEARXNG_SETTINGS_PATH. The image declares /etc/searxng as a VOLUME and
      # the settings loader falls back to that folder, so no env var is needed.
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - core-data:/var/cache/searxng/

# Valkey is only needed if `limiter: true` / `public_instance: true` are set in
# settings.yml. Both are off, so this stays commented out to avoid a dead
# container. NOTE: enabling `public_instance` WITHOUT this service makes
# SearXNG sys.exit(1) at startup — enable the two together, never separately.
#
# valkey:
#   container_name: searxng-valkey
#   image: docker.io/valkey/valkey:9-alpine
#   command: valkey-server --save 30 1 --loglevel warning
#   restart: always
#   volumes:
#     - valkey-data:/data/

volumes:
  core-data:
  # valkey-data:
