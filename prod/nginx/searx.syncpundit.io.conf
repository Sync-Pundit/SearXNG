# SyncPundit SearXNG — nginx front end for searx.syncpundit.io
#
# Two things this adds over the previous config:
#   1. Proxy headers (were missing entirely). Without them SearXNG can't see
#      the real client: it logs "X-Forwarded-For nor X-Real-IP header is set!"
#      and botdetection/limiter cannot work at all.
#   2. A gate on the JSON API. prod/settings.yml enables
#      `formats: [html, json]`, which turns /search?format=json into a fully
#      usable search API on a public host — including queries that spend the
#      Brave API quota. Only the harness may use it.
#
# Deploy: place at /etc/nginx/conf.d/searx.syncpundit.io.conf
#         (replacing the old server blocks), then:
#           sudo nginx -t && sudo systemctl reload nginx

# --- JSON API gate ---------------------------------------------------------
# Generate the token with:  openssl rand -hex 32
# The harness sends it as:  Authorization: Bearer <token>
map $http_authorization $th_authed {
    default                                       0;
    "Bearer REPLACE_ME_WITH_A_32_BYTE_HEX_TOKEN"  1;
}

map $arg_format $th_wants_json {
    default 0;
    json    1;
}

# 1 only when JSON is requested WITHOUT a valid harness token.
map "$th_wants_json:$th_authed" $th_block_json {
    default 0;
    "1:0"   1;
}

server {
    server_name searx.syncpundit.io;
    include /etc/nginx/default.d/*.conf;

    # Inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location / {
        if ($th_block_json) { return 403; }
        proxy_pass http://127.0.0.1:8080;
    }

    # /search is gated harder than the rest of the site.
    location = /search {
        if ($th_block_json) { return 403; }

        # nginx cannot inspect a POST body, so `format=json` submitted as form
        # data would slip past the $arg_format gate above. prod/settings.yml
        # sets `method: "GET"` precisely so that nothing legitimate POSTs here
        # and this rule can close that hole. (Kept scoped to /search — the
        # preferences form is a genuine POST and must keep working.)
        if ($request_method = POST) { return 405; }

        proxy_pass http://127.0.0.1:8080;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/searx.syncpundit.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/searx.syncpundit.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = searx.syncpundit.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name searx.syncpundit.io;
    listen 80;
    return 404; # managed by Certbot
}
