# SearXNG override settings for the SyncPundit threat-hunter harness.
#
# Loaded via SEARXNG_SETTINGS_PATH (see prod/README.md).  Only DELTAS live
# here — `use_default_settings: true` merges these over upstream's
# searx/settings.yml, so upstream defaults keep flowing through on
# `git merge upstream/master`.  Secrets come from the environment via the `!env`
# tag (see searx/settings_loader.py); never hard-code keys in this file.

use_default_settings: true

# WARNING: unlike `engines`, the settings loader REPLACES this whole block
# rather than merging it (settings_loader.py: `default_settings['plugins'] =
# plugins`). Every plugin that should stay on must be listed here, so this
# mirrors the upstream defaults verbatim and appends ours at the end. Re-sync
# with upstream's `plugins:` block after a merge.
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: false
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false
  searx.plugins.tor_check.SXNGPlugin:
    active: false
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true

  # --- fork addition ---
  # Calls the Serper API ONLY when every primary Google engine that actually
  # ran came back with zero results. SearXNG has no native conditional-engine
  # mechanism (all engines fire in parallel), so this lives in a post_search
  # hook. Serper bills 1 credit per request, so on a normal search where Google
  # CSE answers, this costs nothing. Configured by env: SERPER_API_KEY
  # (required — without it the plugin deactivates itself at startup),
  # SERPER_PRIMARY_ENGINES, SERPER_MAX_PAGE.
  searx.plugins.serper_fallback.SXNGPlugin:
    active: true

# Instance branding. These belong here, NOT in searx/settings.yml — editing the
# upstream defaults file means a merge conflict on every `git merge upstream`.
general:
  donation_url: https://buymeacoffee.com/sync_pundit
  contact_url: mailto:searx@syncpundit.io

brand:
  new_issue_url: https://github.com/Sync-Pundit/searxng/issues/new
  wiki_url: https://github.com/Sync-Pundit/searxng/wiki
  issue_url: https://github.com/Sync-Pundit/searxng/issues
  custom:
    # Custom entries in the footer: [title]: [link]
    links:
      Find Me: https://links.syncpundit.io

server:
  # Rotate the secret out of the tracked defaults; supply via env.
  secret_key: !env "SEARXNG_SECRET"

  # Public URL of the instance. REQUIRED behind a reverse proxy: searx/flaskfix.py
  # builds absolute URLs from `base_url` first, then X-Forwarded-Host, then the
  # raw Host header. With this unset, nginx's upstream address leaks into the UI
  # ("Search URL" showed https://127.0.0.1:8080/... and saving preferences
  # redirected to localhost). Setting it here wins over every header, so URL
  # generation no longer depends on proxy config being exactly right.
  base_url: "https://searx.syncpundit.io/"

  # MUST stay false. Upstream's searx/settings.yml defaults this to TRUE, and
  # `use_default_settings: true` inherits it — but the old standalone prod
  # settings.yml had it false, so leaving it unset silently flips behaviour.
  # With public_instance true and no Valkey, searx/limiter.py calls
  # sys.exit(1) at startup ("The limiter requires Valkey") and the container
  # crash-loops. It also force-enables image_proxy and link_token.
  # Only set true together with `limiter: true` AND the valkey service.
  public_instance: false

  # Also false in the old prod config; upstream defaults to true. Enabling it
  # would route every result image through this instance (bandwidth + latency).
  image_proxy: false

  # NOTE: this is only the DEFAULT — a saved preferences cookie overrides it.
  # See `preferences.lock` below, which is what actually guarantees GET.
  #
  # GET instead of the upstream default POST. Required by the nginx JSON gate:
  # nginx can't inspect a POST body, so `format=json` sent as form data would
  # bypass a query-arg check. With GET, every search carries format= in the
  # query string and nginx can refuse POST /search outright.
  # Trade-off: queries become visible in browser history / server access logs.
  # Upstream considers GET acceptable ("may be better for end users and their
  # browsers"); revert to POST only if you also drop the nginx gate.
  method: "GET"

# The ONLY locked preference, and only because the nginx JSON gate depends on
# it. nginx cannot inspect a POST body, so `format=json` submitted as form data
# would bypass the query-arg check; the gate answers that with `return 405` on
# POST /search. That is only safe if nothing legitimate POSTs there.
#
# `server.method: "GET"` alone is just a default, and a saved preferences
# cookie overrides it — a client carrying an older `method=POST` cookie was
# locked out of searching entirely (405 on every query). Locking it forces GET
# for every client regardless of cookie.
#
# Deliberately narrow: engine selection and everything else stay the client's
# choice. Only unlock this if the nginx POST rule is dropped at the same time.
preferences:
  lock:
    - method

search:
  # JSON output for programmatic use by the harness.
  #
  # SECURITY: this instance is internet-reachable (search.syncpundit.io) and
  # runs with `limiter: false`.  Enabling JSON turns it into an open JSON search
  # API.  Gate `format=json` (or the whole instance) to the harness at the
  # reverse proxy — e.g. require an Authorization token / IP allowlist — since
  # the harness calls SearXNG server-side anyway.
  formats:
    - html
    - json

  # Don't let a single Google CAPTCHA blackout the engine for ~15 days
  # (upstream default cf_SearxEngineCaptcha is 1296000s).  Only these keys are
  # overridden; the rest of suspended_times keep their defaults.
  suspended_times:
    SearxEngineCaptcha: 1800
    cf_SearxEngineCaptcha: 3600
    recaptcha_SearxEngineCaptcha: 3600

# POLICY: never REMOVE the client's ability to choose an engine. No
# `inactive: true` (engine not loaded, client cannot enable it) and nothing in
# `preferences.lock` (forced instance-wide). `disabled: true` is allowed where
# there is measured evidence: it only changes the DEFAULT, and any client can
# still switch the engine back on in preferences.
#
# Known-degraded engines as of 2026-07-25, left ON deliberately so clients can
# judge for themselves:
#   brave      ~50% SearxEngineTooManyRequestsException — the HTML scraper and
#              braveapi both hit Brave from this IP on every search
#   startpage  100% failure: get_sc_code redirected to /sp/captcha
#              (datacenter-IP block; would need a residential proxy)
#   bing       two separate problems, measured 2026-07-25:
#              (a) from this datacenter IP it returns irrelevant results for
#                  plain queries — degraded rather than blocked, so it looks
#                  like it worked. A residential IP returns good results for
#                  the same query, so this part is IP reputation.
#              (b) `site:` dorks are CAPTCHA-walled REGARDLESS of IP —
#                  reproduced from a residential IP and a VPN as well as from
#                  the server. No proxy fixes this; it is Bing policy on the
#                  query shape.
#              (c) worse: even after a human solves that CAPTCHA, Bing applies
#                  `site:` but silently DROPS the quoted phrase.
#                  `site:webflow.io "MetaMask"` returned Lottie animations, a
#                  UI component library and Minecraft texture packs - zero
#                  MetaMask mentions. So Bing is not answering dorks at all;
#                  it only looks like it is.
#              Bing is therefore unusable for dork-based hunting, which is
#              most of what this instance is for.
#              NOTE: upstream itself ships bing with `disabled: true` — that
#              default is not ours, and clients can still enable it.
#
# NOTE: urlscan.io is intentionally NOT a SearXNG engine here.
# - Odin's Eye (~/Documents/syncpundit/odin) already has a production-grade
#   urlscan IOC-verdict lookup: backend/services/ioc_providers/urlscan.py
#   (exact-match IOC lookup, verdict extraction, credentialed, TTL-cached,
#   registered + tested). Don't rebuild that here.
# - The discovery/search use case (free-text query across urlscan's corpus
#   for the hunting harness) lives in threat-hunter itself, not SearXNG:
#   ~/Documents/syncpundit/threat-hunter/threat-intel/urlscan.py
engines:
  # Brave Search API — activate the stock stub; key from env.
  # CAPTCHA-free independent SERP (free tier ~2k/mo).
  # Confirmed live 2026-07-25: 18 results, honours `site:` dorks.
  # `disabled: false` = queried on every general search. Flip to true to make
  # it bang-only (`!braveapi`) if the 2k/mo free quota starts running short.
  - name: braveapi
    api_key: !env "BRAVE_API_KEY"
    inactive: false
    disabled: false

  # Yahoo — HTTP/2 disabled for this engine only.
  # Yahoo's search hosts break HTTP/2: httpx raises RemoteProtocolError
  # ("Server disconnected") mid-response, which was 100% of yahoo's requests.
  # Reproduced directly against search.yahoo.com — it fails on HTTP/2 and
  # succeeds on HTTP/1.1, while bing/duckduckgo/brave/startpage are all fine
  # on HTTP/2, so this is Yahoo's bug and not an instance-wide problem.
  # Engine settings become module attributes, and searx/network/network.py
  # reads `enable_http2` off the engine when building its network, so this
  # scopes the workaround to yahoo instead of degrading every engine.
  # (Upstream does the same thing for the image_proxy network.)
  - name: yahoo
    enable_http2: false

  # Bing — OFF BY DEFAULT, client can re-enable in preferences.
  # Upstream already ships bing with `disabled: true`; pinned explicitly here
  # so the default cannot drift if upstream ever flips it. See the measured
  # findings above: it does not answer dorks at all, and returns degraded
  # results for plain queries from this IP. Deliberately NOT `inactive`.
  - name: bing
    disabled: true
