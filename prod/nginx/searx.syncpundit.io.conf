# SyncPundit SearXNG — nginx front end for searx.syncpundit.io
#
# Two things this adds over the previous config:
#   1. Proxy headers (were missing entirely). Without them SearXNG can't see
#      the real client: it logs "X-Forwarded-For nor X-Real-IP header is set!"
#      and botdetection/limiter cannot work at all.
#   2. A gate on the JSON API. prod/settings.yml enables
#      `formats: [html, json]`, which turns /search?format=json into a fully
#      usable search API on a public host — including queries that spend the
#      Brave API quota. Only the harness may use it.
#
# Deploy: place at /etc/nginx/conf.d/searx.syncpundit.io.conf
#         (replacing the old server blocks), then:
#           sudo nginx -t && sudo systemctl reload nginx

# A `Bearer <64 hex chars>` map key is 71 bytes, which overflows nginx's
# default 64-byte map hash bucket:
#   [emerg] could not build map_hash, you should increase map_hash_bucket_size: 64
# 128 is the next power of two that fits.
map_hash_bucket_size 128;

# --- JSON API gate ---------------------------------------------------------
# The token map lives in a SEPARATE, UNCOMMITTED file. This is deliberate:
# a placeholder token inside a committed config is a live credential the
# moment the file is deployed unmodified, and it is readable by anyone with
# access to the repo. Keeping the secret out of git means the worst case is
# nginx refusing to start (fail closed) rather than silently serving the API
# to anyone who has read the repository.
#
# Create it once, on the server:
#
#   TOKEN=$(openssl rand -hex 32)
#   printf 'map $http_authorization $th_authed {\n    default 0;\n    "Bearer %s" 1;\n}\n' "$TOKEN" \
#     | sudo tee /etc/nginx/searx-token.map >/dev/null
#   sudo chmod 640 /etc/nginx/searx-token.map
#   echo "$TOKEN"   # store it in the harness config; it is not recoverable elsewhere
#
# The harness sends it as:  Authorization: Bearer <token>
# Rotation = rewrite that file and `systemctl reload nginx`.
include /etc/nginx/searx-token.map;

map $arg_format $th_wants_json {
    default 0;
    json    1;
}

# 1 only when JSON is requested WITHOUT a valid harness token.
map "$th_wants_json:$th_authed" $th_block_json {
    default 0;
    "1:0"   1;
}

server {
    server_name searx.syncpundit.io;
    include /etc/nginx/default.d/*.conf;

    # Inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # searx/flaskfix.py reads X-Forwarded-Host when building absolute URLs.
    # settings.yml `base_url` already pins this, but sending the header keeps
    # things correct even if base_url is ever cleared.
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    location / {
        if ($th_block_json) { return 403; }
        proxy_pass http://127.0.0.1:8080;
    }

    # /search is gated harder than the rest of the site.
    location = /search {
        if ($th_block_json) { return 403; }

        # nginx cannot inspect a POST body, so `format=json` submitted as form
        # data would slip past the $arg_format gate above. prod/settings.yml
        # sets `method: "GET"` precisely so that nothing legitimate POSTs here
        # and this rule can close that hole. (Kept scoped to /search — the
        # preferences form is a genuine POST and must keep working.)
        if ($request_method = POST) { return 405; }

        proxy_pass http://127.0.0.1:8080;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/searx.syncpundit.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/searx.syncpundit.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = searx.syncpundit.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name searx.syncpundit.io;
    listen 80;
    return 404; # managed by Certbot
}
